query: SELECT EXTRA FROM PERSON INTO EXTRA_SINK

sinks:
  - name: NAME_SINK 
    host: worker-max:8080
    schema:
      - name: PERSON$name
        type: VARSIZED
    type: Void
    config: { }
  - name: PERSON_ID_SINK 
    host: worker-max:8080
    schema:
      - name: PERSON$id
        type: INT32
    type: Void
    config: { }
  - name: BID_AUCTION_ID_SINK 
    host: worker-max:8080
    schema:
      - name: BID$AUCTIONID
        type: INT32
    type: Void
    config: { }
  - name: EXTRA_SINK
    host: worker-max:8080
    schema:
      - name: PERSON$EXTRA
        type: VARSIZED
    type: Void
    config: { }
  - name: PERSON_SINK 
    host: worker-max:8080
    schema:
      - name: PERSON$id
        type: INT32
      - name: PERSON$name
        type: VARSIZED
      - name: PERSON$email_address
        type: VARSIZED
      - name: PERSON$credit_card
        type: VARSIZED
      - name: PERSON$city
        type: VARSIZED
      - name: PERSON$state
        type: VARSIZED
      - name: PERSON$timestamp
        type: UINT64
      - name: PERSON$EXTRA
        type: VARSIZED
    type: Void
    config: { }

logical:
  - name: BID
    schema:
      - name: TIMESTAMP
        type: UINT64
      - name: AUCTIONID
        type: INT32
      - name: BIDDER
        type: INT32
      - name: PRICE
        type: FLOAT64

  - name: PERSON
    schema:
      - name: ID
        type: INT32
      - name: NAME
        type: VARSIZED
      - name: EMAIL_ADDRESS
        type: VARSIZED
      - name: CREDIT_CARD
        type: VARSIZED
      - name: CITY
        type: VARSIZED
      - name: STATE
        type: VARSIZED
      - name: TIMESTAMP
        type: UINT64
      - name: EXTRA
        type: VARSIZED

  - name: AUCTION
    schema:
      - name: TIMESTAMP
        type: UINT64
      - name: ID
        type: INT32
      - name: INITIALBID
        type: INT32
      - name: RESERVE
        type: INT32
      - name: EXPIRES
        type: UINT64
      - name: SELLER
        type: INT32
      - name: CATEGORY
        type: INT32

physical:
  - logical: BID
    host: worker-max:8080
    type: File
    parser_config:
      type: JSON
    source_config:
      file_path: "/work/large/nexmark-json/bid_6GB.json"

  - logical: AUCTION
    host: worker-max:8080
    type: File
    parser_config:
      type: JSON
    source_config:
      file_path: "/work/large/nexmark-json/auction_707MB.json"

  - logical: PERSON
    host: worker-max:8080
    type: File
    parser_config:
      type: JSON
    source_config:
      file_path: "/work/large/nexmark-json/person_840MB.json"
