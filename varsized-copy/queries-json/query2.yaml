query: SELECT ID FROM PERSON WHERE CITY == VARSIZED("redmond") AND STATE == VARSIZED("wy") INTO PERSON_ID_SINK

sinks:
  - name: NAME_SINK
    host: worker-max:8080
    schema:
      - name: PERSON$NAME
        type: VARSIZED
    type: Void
    config: { }
  - name: PERSON_ID_SINK
    host: worker-max:8080
    schema:
      - name: PERSON$ID
        type: INT32
    type: Void
    config: { }
  - name: BID_AUCTION_ID_SINK
    host: worker-max:8080
    schema:
      - name: BID$AUCTIONID
        type: INT32
    type: Void
    config: { }
  - name: EXTRA_SINK
    host: worker-max:8080
    schema:
      - name: PERSON$EXTRA
        type: VARSIZED
    type: Void
    config: { }
  - name: PERSON_SINK
    host: worker-max:8080
    schema:
      - name: PERSON$ID
        type: INT32
      - name: PERSON$NAME
        type: VARSIZED
      - name: PERSON$EMAIL_ADDRESS
        type: VARSIZED
      - name: PERSON$CREDIT_CARD
        type: VARSIZED
      - name: PERSON$CITY
        type: VARSIZED
      - name: PERSON$STATE
        type: VARSIZED
      - name: PERSON$TIMESTAMP
        type: UINT64
      - name: PERSON$EXTRA
        type: VARSIZED
    type: Void
    config: { }

logical:
  - name: BID
    schema:
      - name: TIMESTAMP
        type: UINT64
      - name: AUCTIONID
        type: INT32
      - name: BIDDER
        type: INT32
      - name: PRICE
        type: FLOAT64

  - name: PERSON
    schema:
      - name: ID
        type: INT32
      - name: NAME
        type: VARSIZED
      - name: EMAIL_ADDRESS
        type: VARSIZED
      - name: CREDIT_CARD
        type: VARSIZED
      - name: CITY
        type: VARSIZED
      - name: STATE
        type: VARSIZED
      - name: TIMESTAMP
        type: UINT64
      - name: EXTRA
        type: VARSIZED

  - name: AUCTION
    schema:
      - name: TIMESTAMP
        type: UINT64
      - name: ID
        type: INT32
      - name: INITIALBID
        type: INT32
      - name: RESERVE
        type: INT32
      - name: EXPIRES
        type: UINT64
      - name: SELLER
        type: INT32
      - name: CATEGORY
        type: INT32

physical:
  - logical: BID
    host: worker-max:8080
    type: File
    parser_config:
      type: JSON
    source_config:
      file_path: "/work/large/nexmark-json/bid_6GB.json"

  - logical: AUCTION
    host: worker-max:8080
    type: File
    parser_config:
      type: JSON
    source_config:
      file_path: "/work/large/nexmark-json/auction_707MB.json"

  - logical: PERSON
    host: worker-max:8080
    type: File
    parser_config:
      type: JSON
    source_config:
      file_path: "/work/large/nexmark-json/person_840MB.json"
